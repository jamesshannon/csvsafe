<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- Simple 3x3 grid -->
  <!-- Horizontal lines -->
  <line x1="1" y1="1" x2="13" y2="1" stroke="black" stroke-width="1.2"/>
  <line x1="1" y1="5" x2="13" y2="5" stroke="black" stroke-width="1.2"/>
  <line x1="1" y1="9" x2="13" y2="9" stroke="black" stroke-width="1.2"/>
  <line x1="1" y1="13" x2="13" y2="13" stroke="black" stroke-width="1.2"/>

  <!-- Vertical lines -->
  <line x1="1" y1="1" x2="1" y2="13" stroke="black" stroke-width="1.2"/>
  <line x1="5" y1="1" x2="5" y2="13" stroke="black" stroke-width="1.2"/>
  <line x1="9" y1="1" x2="9" y2="13" stroke="black" stroke-width="1.2"/>
  <line x1="13" y1="1" x2="13" y2="13" stroke="black" stroke-width="1.2"/>

  <!-- Checkmark (bottom-right) -->
  <polyline points="10,13.5 12.5,16 17,10.5" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
